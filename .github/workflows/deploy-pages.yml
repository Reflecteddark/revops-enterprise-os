name: Deploy ai-rop.ru Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync_gh_pages:
    name: Sync web/ to gh-pages branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync web/ files to gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Сохраняем свежие файлы из папки web/
          mkdir -p /tmp/site_dist
          cp -r web/* /tmp/site_dist/
          
          # 2. Переключаемся на ветку gh-pages
          git checkout gh-pages
          
          # 3. Синхронизируем файлы в корень gh-pages
          cp -r /tmp/site_dist/* .
          git add -A
          
          # 4. Коммитим и пушим при наличии изменений
          git diff-index --quiet HEAD || (git commit -m "chore(pages): auto-sync web/ to gh-pages [skip ci]" && git push origin gh-pages)
