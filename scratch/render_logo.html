<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 512px;
    height: 512px;
    background: #0B0F19;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .canvas {
    width: 512px;
    height: 512px;
    position: relative;
    background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0B0F19 75%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Outer ambient glow */
  .glow {
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(16, 185, 129, 0.15) 50%, transparent 70%);
    filter: blur(40px);
  }
  .circle-bg {
    width: 440px;
    height: 440px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
    border: 2px solid rgba(99, 102, 241, 0.3);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  svg {
    width: 280px;
    height: 280px;
    filter: drop-shadow(0 10px 20px rgba(99, 102, 241, 0.4));
  }
  .brand-text {
    position: absolute;
    bottom: 55px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #F8FAFC;
    text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge {
    background: linear-gradient(135deg, #6366f1, #10b981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="circle-bg">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad1" x1="10" y1="90" x2="90" y2="10" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="50%" stop-color="#818CF8"/>
            <stop offset="100%" stop-color="#10B981"/>
          </linearGradient>
          <linearGradient id="glowGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
          </linearGradient>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B981" flood-opacity="0.4"/>
          </filter>
        </defs>

        <!-- Soundwave / Audio AI bars -->
        <rect x="18" y="55" width="4" height="15" rx="2" fill="#6366F1" opacity="0.7"/>
        <rect x="26" y="42" width="4" height="28" rx="2" fill="#818CF8" opacity="0.8"/>
        <rect x="34" y="32" width="4" height="38" rx="2" fill="#A5B4FC" opacity="0.9"/>
        <rect x="42" y="24" width="4" height="46" rx="2" fill="#C7D2FE"/>
        <rect x="50" y="36" width="4" height="34" rx="2" fill="#818CF8" opacity="0.85"/>
        <rect x="58" y="28" width="4" height="42" rx="2" fill="#6EE7B7" opacity="0.9"/>
        <rect x="66" y="20" width="4" height="50" rx="2" fill="#34D399"/>
        <rect x="74" y="38" width="4" height="32" rx="2" fill="#10B981" opacity="0.8"/>
        <rect x="82" y="50" width="4" height="20" rx="2" fill="#059669" opacity="0.7"/>

        <!-- Upward Breakthrough Arrow / Chart -->
        <path d="M 16 68 L 36 50 L 52 56 L 84 22" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
        
        <!-- Glowing Nodes -->
        <circle cx="84" cy="22" r="6" fill="#10B981" filter="url(#shadow)"/>
        <circle cx="84" cy="22" r="2.5" fill="#FFFFFF"/>
        <circle cx="52" cy="56" r="4.5" fill="#818CF8"/>
        <circle cx="36" cy="50" r="4.5" fill="#6366F1"/>
        <circle cx="16" cy="68" r="4.5" fill="#4F46E5"/>
      </svg>
      <div class="brand-text">
        <span>AI</span><span class="badge">-ROP</span>
      </div>
    </div>
  </div>
</body>
</html>
